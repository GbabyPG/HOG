<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hidden Quest: Waldo Edition</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #181920;
            --accent-color: #ff3366;
            --accent-gold: #ffd700;
            --text-color: #f0f0f5;
            --success-color: #00e676;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stats-bar {
            display: flex;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .stat-box {
            background: rgba(255,255,255,0.06);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-viewport {
            position: relative;
            width: 100%;
            flex: 1;
            overflow: hidden;
            background: #050508;
            cursor: grab;
        }

        .game-viewport:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        .ui-panel {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .key-title {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .item-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            touch-action: pan-x;
        }

        .item-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 110px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .item-card.found {
            background: rgba(0, 230, 118, 0.15);
            border-color: var(--success-color);
            opacity: 0.5;
        }

        .item-card.found span {
            text-decoration: line-through;
            color: var(--success-color);
        }

        .item-icon {
            font-size: 1.3rem;
        }

        .item-name {
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls {
            display: flex;
            gap: 6px;
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        button.btn-secondary {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-color);
        }

        button:active {
            transform: scale(0.95);
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 1.3rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            border: 2px solid var(--accent-color);
        }

        .modal-content h2 {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .modal-content p {
            margin-bottom: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔍 Waldo Quest</h1>
        <div class="stats-bar">
            <div class="stat-box">Pts: <span id="score">0</span></div>
            <div class="stat-box">x<span id="combo">1</span></div>
            <div class="stat-box"><span id="timer">00:00</span></div>
        </div>
    </header>

    <div class="game-viewport" id="viewport">
        <canvas id="gameCanvas" width="2000" height="1400"></canvas>
    </div>

    <div class="ui-panel">
        <div class="key-title">
            <span>Find Target Items (<span id="found-count">0</span>/<span id="total-count">0</span>)</span>
            <span id="level-name" style="color: var(--accent-gold);">Level 1</span>
        </div>

        <div class="item-list" id="item-list"></div>

        <div class="controls-row">
            <div class="zoom-controls">
                <button class="btn-secondary" id="zoom-in">+</button>
                <button class="btn-secondary" id="zoom-out">-</button>
                <button class="btn-secondary" id="reset-view">Fit</button>
            </div>
            <div>
                <button id="hint-btn">💡 Hint (-100)</button>
                <button class="btn-secondary" id="restart-btn">🔄</button>
            </div>
        </div>
    </div>

    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2>Area Cleared! 🎉</h2>
            <p id="modal-stats">You found everyone!</p>
            <button id="next-btn">Next Level ➔</button>
        </div>
    </div>

    <script>
        // --- ASSET POOLS & CROWD GENERATION ---
        const TARGET_ITEMS = [
            { name: "Waldo Guy", emoji: "🧙‍♂️" }, { name: "Red Apple", emoji: "🍎" }, { name: "Golden Key", emoji: "🔑" },
            { name: "Small Frog", emoji: "🐸" }, { name: "Magic Gem", emoji: "💎" }, { name: "Spy Glass", emoji: "🔭" },
            { name: "Tiny Parrot", emoji: "🦜" }, { name: "Skull", emoji: "💀" }, { name: "Treasure Map", emoji: "🗺️" },
            { name: "Gold Coin", emoji: "🪙" }, { name: "Compass", emoji: "🧭" }, { name: "Crown", emoji: "👑" },
            { name: "Magic Wand", emoji: "🪄" }, { name: "Alien", emoji: "👽" }, { name: "Rubber Duck", emoji: "🦆" }
        ];

        // Massive variety of crowd filler elements to hide targets inside
        const CROWD_DECORATIONS = [
            "🚶‍♂️", "🏃‍♀️", "🚶‍♀️", "🧗‍♂️", "🚴‍♀️", "🧍‍♂️", "🧍‍♀️", "🤺", "🏇", "⛷️",
            "🎪", "🎡", "🎢", "🏠", "⛺", "🌲", "🌳", "🌴", "🪨", "🚗", 
            "🚌", "🚏", "🏖️", "⛵", "🛳️", "⛩️", "🗿", "⛲", "🗿", "🚩"
        ];

        const BACKGROUND_THEMES = [
            { name: "Crowded Beach", bg: "#e6c594", grid: "#d4b07b" },
            { name: "Bustling City", bg: "#3a3d40", grid: "#2e3033" },
            { name: "Fantasy Carnival", bg: "#2d1b4e", grid: "#22133d" },
            { name: "Dense Forest", bg: "#1e3a1e", grid: "#152815" }
        ];

        function pseudoRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // --- PROCEDURAL HUGE LEVEL GENERATOR ---
        function generateLevel(levelNum) {
            let seed = levelNum * 987.654;
            const rand = () => pseudoRandom(seed++);

            const theme = BACKGROUND_THEMES[Math.floor(rand() * BACKGROUND_THEMES.length)];
            const itemCount = Math.min(12, 5 + Math.floor(levelNum / 2));

            // Generate HUGE CROWD (Over 1,200 elements per level!)
            const crowd = [];
            const crowdDensity = 1200 + Math.floor(rand() * 400);

            for (let i = 0; i < crowdDensity; i++) {
                crowd.push({
                    emoji: CROWD_DECORATIONS[Math.floor(rand() * CROWD_DECORATIONS.length)],
                    x: 30 + rand() * 1940,
                    y: 30 + rand() * 1340,
                    size: 20 + rand() * 25
                });
            }

            // Hide Targets inside crowd
            const shuffledTargets = [...TARGET_ITEMS].sort(() => rand() - 0.5);
            const items = [];

            for (let i = 0; i < itemCount; i++) {
                const targetDef = shuffledTargets[i % shuffledTargets.length];
                items.push({
                    id: `item_${levelNum}_${i}`,
                    name: targetDef.name,
                    emoji: targetDef.emoji,
                    x: 80 + rand() * 1840,
                    y: 80 + rand() * 1240,
                    radius: 18
                });
            }

            return {
                name: `${theme.name} #${levelNum}`,
                theme,
                crowd,
                items
            };
        }

        // --- GAME ENGINE & ZOOM/PAN STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');

        let currentLevelIdx = 1;
        let currentLevelData = null;
        let score = 0;
        let combo = 1;
        let comboTimer = null;
        let foundItems = new Set();
        let startTime = 0;
        let timerInterval = null;
        let hintActive = null;

        // Viewport Camera Transform
        let scale = 0.5;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function centerCanvas() {
            const vpRect = viewport.getBoundingClientRect();
            scale = Math.min(vpRect.width / canvas.width, vpRect.height / canvas.height);
            panX = (vpRect.width - canvas.width * scale) / 2;
            panY = (vpRect.height - canvas.height * scale) / 2;
            updateTransform();
        }

        // Mouse / Touch Dragging Pan Controls
        viewport.addEventListener('pointerdown', (e) => {
            isDragging = true;
            dragStartX = e.clientX - panX;
            dragStartY = e.clientY - panY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - dragStartX;
            panY = e.clientY - dragStartY;
            updateTransform();
        });

        window.addEventListener('pointerup', () => isDragging = false);

        // Zoom Buttons
        document.getElementById('zoom-in').addEventListener('click', () => {
            scale = Math.min(2.5, scale * 1.3);
            updateTransform();
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            scale = Math.max(0.3, scale / 1.3);
            updateTransform();
        });

        document.getElementById('reset-view').addEventListener('click', centerCanvas);

        // --- DRAWING THE SCENE ---
        function drawStage() {
            const level = currentLevelData;

            // Background
            ctx.fillStyle = level.theme.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Crowd
            level.crowd.forEach(person => {
                ctx.font = `${person.size}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(person.emoji, person.x, person.y);
            });

            // Target Items
            level.items.forEach(item => {
                ctx.save();
                ctx.font = `${item.radius * 1.8}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                if (foundItems.has(item.id)) {
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius + 5, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00e676';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.globalAlpha = 0.5;
                }

                ctx.fillText(item.emoji, item.x, item.y);
                ctx.restore();

                if (hintActive === item.id) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius + 20, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 6;
                    ctx.setLineDash([8, 8]);
                    ctx.stroke();
                    ctx.restore();
                }
            });
        }

        // Tap/Click Detection considering Zoom & Pan
        viewport.addEventListener('click', (e) => {
            // Ignore if dragging took place
            const rect = viewport.getBoundingClientRect();
            const clickX = (e.clientX - rect.left - panX) / scale;
            const clickY = (e.clientY - rect.top - panY) / scale;

            if (clickX < 0 || clickX > canvas.width || clickY < 0 || clickY > canvas.height) return;

            const level = currentLevelData;
            let hit = false;

            level.items.forEach(item => {
                if (foundItems.has(item.id)) return;

                const dist = Math.hypot(clickX - item.x, clickY - item.y);
                if (dist <= item.radius + 10) { // Tolerant hit detection
                    hit = true;
                    onItemFound(item, e.clientX, e.clientY);
                }
            });

            if (!hit && !isDragging) {
                onMiss(e.clientX, e.clientY);
            }
        });

        // Game Flow Handlers
        function initLevel(levelNum) {
            currentLevelIdx = levelNum;
            currentLevelData = generateLevel(currentLevelIdx);
            foundItems.clear();
            hintActive = null;

            document.getElementById('level-name').textContent = `Level ${currentLevelIdx}`;
            document.getElementById('found-count').textContent = "0";
            document.getElementById('total-count').textContent = currentLevelData.items.length;

            renderKey();
            drawStage();
            centerCanvas();
            startTimer();
        }

        function renderKey() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';

            currentLevelData.items.forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${foundItems.has(item.id) ? 'found' : ''}`;
                card.innerHTML = `
                    <div class="item-icon">${item.emoji}</div>
                    <div class="item-name">${item.name}</div>
                `;
                listEl.appendChild(card);
            });
        }

        function onItemFound(item, clientX, clientY) {
            foundItems.add(item.id);
            if (hintActive === item.id) hintActive = null;

            score += 200 * combo;
            document.getElementById('score').textContent = score;
            combo++;
            document.getElementById('combo').textContent = combo;

            showFloatingText(`+${200 * (combo - 1)}`, clientX, clientY, '#00e676');
            document.getElementById('found-count').textContent = foundItems.size;

            renderKey();
            drawStage();

            if (foundItems.size === currentLevelData.items.length) {
                setTimeout(onLevelComplete, 400);
            }
        }

        function onMiss(clientX, clientY) {
            combo = 1;
            document.getElementById('combo').textContent = combo;
            score = Math.max(0, score - 20);
            document.getElementById('score').textContent = score;
            showFloatingText('-20', clientX, clientY, '#ff3366');
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.color = color;
            el.style.left = `${x - 15}px`;
            el.style.top = `${y - 20}px`;

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const secs = String(elapsed % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        document.getElementById('hint-btn').addEventListener('click', () => {
            const remaining = currentLevelData.items.filter(i => !foundItems.has(i.id));
            if (remaining.length === 0) return;

            score = Math.max(0, score - 100);
            document.getElementById('score').textContent = score;

            const randomItem = remaining[Math.floor(Math.random() * remaining.length)];
            hintActive = randomItem.id;

            // Auto-pan camera to target hint
            const vpRect = viewport.getBoundingClientRect();
            scale = 1.2;
            panX = (vpRect.width / 2) - (randomItem.x * scale);
            panY = (vpRect.height / 2) - (randomItem.y * scale);
            updateTransform();

            drawStage();
        });

        function onLevelComplete() {
            clearInterval(timerInterval);
            document.getElementById('modal-stats').innerHTML = 
                `Cleared Level ${currentLevelIdx} in <b>${document.getElementById('timer').textContent}</b>!<br>Score: <b>${score} pts</b>`;
            document.getElementById('win-modal').classList.add('active');
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            document.getElementById('win-modal').classList.remove('active');
            initLevel(currentLevelIdx + 1);
        });

        document.getElementById('restart-btn').addEventListener('click', () => initLevel(currentLevelIdx));

        // Start Level 1
        window.addEventListener('resize', centerCanvas);
        initLevel(1);
    </script>
</body>
</html>
