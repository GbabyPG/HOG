<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery of the Forgotten Isle - Level 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Game Area -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            <div id="overlay" class="hidden">
                <h1 id="overlay-title">Level Complete!</h1>
                <p id="overlay-desc">You found all the hidden items!</p>
                <button onclick="restartLevel()">Play Again</button>
            </div>
        </div>

        <!-- Sidebar UI -->
        <div id="sidebar">
            <div class="header">
                <h2>Level 4</h2>
                <h3>The Alchemist's Study</h3>
            </div>

            <div class="stats">
                <div>Time: <span id="timer">03:00</span></div>
                <div>Score: <span id="score">0</span></div>
            </div>

            <div class="item-list-container">
                <h4>Find Items (<span id="found-count">0</span>/5):</h4>
                <ul id="item-list"></ul>
            </div>

            <div class="controls">
                <button id="hint-btn" onclick="useHint()">HINT (<span id="hint-count">2</span>)</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
